<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdNova - Modern Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Pre-load Theme & Direction
        const savedTheme = localStorage.getItem('theme') || 'light';
        const savedDir = localStorage.getItem('dir') || 'ltr';

        const html = document.documentElement;
        html.dir = savedDir;
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
        } else {
            html.classList.remove('dark');
        }

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                        heading: ['Space Grotesk', 'sans-serif'],
                    }
                }
            },
            plugins: [
                function ({ addVariant }) {
                    addVariant('rtl', 'html[dir="rtl"] &');
                }
            ]
        }
    </script>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body class="bg-slate-950 font-sans text-slate-100 overflow-x-hidden min-h-screen select-none">

    <!-- Cinematic Background -->
    <div class="fixed inset-0 z-0">
        <!-- Base image -->
        <img src="https://images.unsplash.com/photo-1542744173-8e7e53415bb0?q=80&w=2000&auto=format&fit=crop"
            class="w-full h-full object-cover scale-105 filter blur-sm opacity-40 mix-blend-luminosity animate-pulse-slow">
        <!-- Gradients over image -->
        <div class="absolute inset-0 bg-gradient-to-tr from-slate-950 via-emerald-950/80 to-violet-950/80"></div>
        <!-- Ambient Orbs -->
        <div
            class="absolute top-0 right-0 w-[50vw] h-[50vw] bg-emerald-500/20 rounded-full blur-[150px] translate-x-1/3 -translate-y-1/3 animate-float">
        </div>
        <div class="absolute bottom-0 left-0 w-[40vw] h-[40vw] bg-violet-500/20 rounded-full blur-[150px] -translate-x-1/3 translate-y-1/3 animate-float"
            style="animation-delay: 2s;"></div>
    </div>

    <!-- UI Layer -->
    <div class="relative z-10 min-h-screen flex flex-col justify-between p-6 md:p-12">

        <!-- Top branding -->
        <div class="flex justify-between items-center w-full animate-fade-in-down">
            <a href="index.html" class="flex items-center gap-3 group">
                <div
                    class="w-10 h-10 md:w-12 md:h-12 bg-white/10 backdrop-blur-md rounded-2xl border border-white/20 flex items-center justify-center text-white font-black text-xl md:text-2xl group-hover:bg-emerald-500 transition-colors shadow-xl shrink-0">
                    A</div>
                <span class="text-xl md:text-2xl font-black tracking-tighter text-white">Ad<span
                        class="text-emerald-400">Nova</span></span>
            </a>

            <div class="flex items-center gap-2">
                <button id="dir-toggle"
                    class="p-2.5 rounded-xl bg-white/5 border border-white/10 text-slate-300 hover:bg-emerald-500 hover:text-white transition-all shadow-lg backdrop-blur-md">
                    <i data-lucide="globe" class="w-5 h-5"></i>
                </button>
                <button id="theme-toggle"
                    class="p-2.5 rounded-xl bg-white/5 border border-white/10 text-slate-300 hover:bg-emerald-500 hover:text-white transition-all shadow-lg backdrop-blur-md">
                    <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
                    <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                </button>
            </div>

        </div>

        <!-- Center Auth Modal -->
        <div class="flex-1 flex items-center justify-center w-full my-12 animate-zoom-in">
            <div
                class="w-full max-w-md bg-white/10 dark:bg-slate-900/40 backdrop-blur-3xl p-10 md:p-12 rounded-[3rem] border border-white/20 shadow-[0_0_50px_rgba(0,0,0,0.5)] relative overflow-hidden group">
                <!-- Glossy highlight -->
                <div
                    class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-px bg-gradient-to-r from-transparent via-white/40 to-transparent">
                </div>

                <div class="text-center mb-10">
                    <h2 class="text-3xl font-heading font-black text-white mb-2 tracking-tight">Welcome Back</h2>
                    <p class="text-slate-300 font-medium text-sm">Secure entry to your AdNova dashboard.</p>
                </div>

                <form class="space-y-5" onsubmit="event.preventDefault(); window.location.href='user_dashboard.html';">

                    <div class="animate-fade-in-up delay-100">
                        <label
                            class="block text-[10px] font-black text-slate-300 uppercase tracking-widest mb-2 ml-1">Protocol
                            / Email</label>
                        <div class="relative">
                            <i data-lucide="mail"
                                class="absolute left-5 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-300"></i>
                            <input type="email"
                                class="w-full bg-black/40 border border-white/10 rounded-2xl py-4 pl-14 pr-5 text-white placeholder-slate-400 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all font-medium"
                                placeholder="agent@adnova.co">
                        </div>
                    </div>

                    <div class="animate-fade-in-up delay-200">
                        <div class="flex justify-between items-end mb-2 ml-1">
                            <label
                                class="block text-[10px] font-black text-slate-300 uppercase tracking-widest">Passcode</label>
                            <a href="#"
                                class="text-[10px] font-bold text-emerald-400 hover:text-emerald-300 transition-colors uppercase tracking-wider">Reset?</a>
                        </div>
                        <div class="relative">
                            <i data-lucide="lock"
                                class="absolute left-5 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-300"></i>
                            <input type="password"
                                class="w-full bg-black/40 border border-white/10 rounded-2xl py-4 pl-14 pr-12 text-white placeholder-slate-400 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all font-medium font-mono tracking-widest"
                                placeholder="••••••••">
                            <button type="button"
                                class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-300 hover:text-white transition-colors">
                                <i data-lucide="eye" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <button
                        class="w-full bg-emerald-500 text-white font-black text-lg py-4 rounded-2xl hover:bg-emerald-400 transition-all shadow-lg shadow-emerald-500/25 active:scale-95 mt-4 flex items-center justify-center gap-2 group animate-fade-in-up delay-300">
                        <span>Login</span>
                        <i data-lucide="arrow-right" class="w-5 h-5 group-hover:translate-x-1 transition-transform"></i>
                    </button>
                </form>

                <div class="mt-6 text-center animate-fade-in-up delay-300">
                    <p class="text-sm text-slate-400">Don't have an account? <a href="register.html" class="text-emerald-400 hover:text-white font-bold transition-colors">Create Account</a></p>
                </div>

                <div class="mt-8 pt-6 border-t border-white/10 text-center animate-fade-in-up delay-400">
                    <p class="text-xs text-slate-500 font-medium">Alternative entry vectors</p>
                    <div class="flex justify-center gap-4 mt-4">
                        <button
                            class="w-12 h-12 bg-white/5 hover:bg-white/10 rounded-full border border-white/10 flex items-center justify-center transition-all">
                            <!-- Google Icon SVG (simplified) -->
                            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none">
                                <path
                                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
                                    fill="#4285F4" />
                                <path
                                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                    fill="#34A853" />
                                <path
                                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                                    fill="#FBBC05" />
                                <path
                                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                    fill="#EA4335" />
                            </svg>
                        </button>
                        <button
                            class="w-12 h-12 bg-white/5 hover:bg-white/10 rounded-full border border-white/10 flex items-center justify-center text-white transition-all">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom status -->
        <div
            class="flex justify-between flex-col md:flex-row items-center w-full mt-auto opacity-60 hover:opacity-100 transition-opacity animate-fade-in-up">
            <span class="text-xs font-mono font-bold tracking-widest text-emerald-400 mb-2 md:mb-0"><span
                    class="w-2 h-2 inline-block bg-emerald-400 rounded-full mr-2 animate-ping"></span> SECURE
                CONNECTION</span>
            <span class="text-xs font-bold text-slate-300">AdNova Protocol v2.4.1</span>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
    <script src="main.js"></script>
    <script src="rtltoggle.js"></script>
</body>

</html>
